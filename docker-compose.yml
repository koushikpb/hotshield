services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotshield
      POSTGRES_USER: hotshield
      POSTGRES_PASSWORD: hotshield
    ports:
      # Not 5432 on the host, so a locally installed Postgres is never picked up by mistake.
      - "${PG_HOST_PORT:-5434}:5432"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hotshield"]
      interval: 2s
      retries: 15

  # Three nodes behind nginx, standing in for ECS tasks behind the ALB. Started only with
  # `docker compose --profile cluster up -d --build`, so plain `docker compose up -d` stays Postgres-only.
  # Each node is also published directly (8081-8083) so per-node counters can be polled; through nginx every
  # sample would come from a different node.
  node-a: &node
    profiles: [cluster]
    build: .
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &node-env
      NODE_ID: node-a
      PEERS: node-a=http://node-a:8080,node-b=http://node-b:8080,node-c=http://node-c:8080
      HOTSHIELD_MODE: ${HOTSHIELD_MODE:-distributed}
      HOTSHIELD_CACHE_TTL: ${HOTSHIELD_CACHE_TTL:-30s}
      HOTSHIELD_DB_DELAY: ${HOTSHIELD_DB_DELAY:-0ms}
      DB_URL: jdbc:postgresql://postgres:5432/hotshield
      # Tracing is opt-in: TRACING=-javaagent:/app/opentelemetry-javaagent.jar docker compose --profile cluster up
      # Leave it unset for benchmark runs so the numbers don't include agent overhead.
      JAVA_TOOL_OPTIONS: ${TRACING:-}
      OTEL_SERVICE_NAME: hotshield
      # Parent-based so node-b and node-c follow node-a's sampling decision. Lower TRACE_RATIO under load:
      # at 1.0 every k6 request is traced and the exporter queue drops spans without saying so.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${TRACE_RATIO:-1.0}
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=node-a
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
  node-b:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-b
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=node-b
    ports:
      - "8082:8080"
  node-c:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-c
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=node-c
    ports:
      - "8083:8080"

  jaeger:
    profiles: [cluster]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      # The in-memory store is otherwise unbounded and grows for as long as a load run is traced.
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686"

  lb:
    profiles: [cluster]
    image: nginx:1.27-alpine
    depends_on: [node-a, node-b, node-c]
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
