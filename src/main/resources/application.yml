spring:
  application:
    name: hotshield
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/hotshield}
    username: ${DB_USER:hotshield}
    password: ${DB_PASSWORD:hotshield}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      data-source-properties:
        # Bounds every query, so the slowest read path (and the tombstone TTL derived from it) has an upper limit.
        options: -c statement_timeout=${hotshield.db-statement-timeout}
  jackson:
    deserialization:
      # A PUT missing priceCents or stock would otherwise write 0 for them.
      fail-on-missing-creator-properties: true
      fail-on-null-for-primitives: true
  threads:
    virtual:
      enabled: true

hotshield:
  mode: ${HOTSHIELD_MODE:direct}   # direct | cache | coalesce | distributed
  node-id: ${NODE_ID:node-a}
  peers: ${PEERS:}                  # id=url pairs, self included: node-a=http://node-a:8080,node-b=...
  forward-timeout: ${FORWARD_TIMEOUT:500ms}
  db-delay: ${HOTSHIELD_DB_DELAY:0ms}      # herd runs only
  db-statement-timeout: ${DB_STATEMENT_TIMEOUT:2s}
  cache:
    max-size: ${HOTSHIELD_CACHE_MAX_SIZE:100000}
    ttl: ${HOTSHIELD_CACHE_TTL:30s}
    tombstone-ttl: ${HOTSHIELD_TOMBSTONE_TTL:10s}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      # /actuator/health/liveness leaves the database out, so the load balancer doesn't pull nodes during a run
      # that is meant to stress the database.
      probes:
        enabled: true
