spring:
  application:
    name: hotshield
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/hotshield}
    username: ${DB_USER:hotshield}
    password: ${DB_PASSWORD:hotshield}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
  jackson:
    deserialization:
      # A PUT missing priceCents or stock would otherwise write 0 for them.
      fail-on-missing-creator-properties: true
      fail-on-null-for-primitives: true
  threads:
    virtual:
      enabled: true

hotshield:
  mode: ${HOTSHIELD_MODE:direct}   # direct | cache | coalesce | distributed
  node-id: ${NODE_ID:node-a}
  peers: ${PEERS:}                  # id=url pairs, self included: node-a=http://node-a:8080,node-b=...
  forward-timeout: ${FORWARD_TIMEOUT:500ms}
  db-delay: ${HOTSHIELD_DB_DELAY:0ms}      # herd runs only, see loadtest/README.md
  cache:
    max-size: ${HOTSHIELD_CACHE_MAX_SIZE:100000}
    ttl: ${HOTSHIELD_CACHE_TTL:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
