# The defaults (1 worker, 512 connections shared by client and upstream sides) fail around 250 concurrent
# requests, which would cap every local run at nginx instead of the app.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    # Round robin, like the ALB: a request for any key can land on any node, so non-owners really forward.
    upstream nodes {
        server node-a:8080;
        server node-b:8080;
        server node-c:8080;
        keepalive 64;
    }

    server {
        listen 8080;

        # The owner-to-owner path is for nodes only.
        location /internal/ {
            return 404;
        }

        location / {
            proxy_pass http://nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # nginx would otherwise retry a failed GET on another node, hiding errors in the kill experiment.
            proxy_next_upstream off;
        }
    }
}
